<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f3ea">
    <title>Tio Eric's Family Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="summary" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Private family tracker</p>
          <h1 id="app-title">Tio Eric's Family Tracker</h1>
        </div>
        <button id="refresh-button" class="icon-button" type="button" aria-label="Reload family data" title="Reload">
          <span aria-hidden="true">↻</span>
        </button>
      </section>

      <section class="controls" aria-label="Net worth settings">
        <label class="money-field">
          <span>Net worth</span>
          <input id="net-worth" inputmode="decimal" autocomplete="off" value="1000000">
        </label>
        <label class="select-field">
          <span>Lookback</span>
          <select id="lookback">
            <option value="all">All imported history</option>
            <option value="365">Last 12 months</option>
            <option value="180">Last 6 months</option>
            <option value="90">Last 90 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </label>
      </section>

      <section class="scoreboard" aria-labelledby="leaderboard-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">Ranked by attention</p>
            <h2 id="leaderboard-title">Leaderboard</h2>
          </div>
          <p id="total-interactions" class="stat">0 touches</p>
        </div>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>

      <section class="details" aria-labelledby="details-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">Method</p>
            <h2 id="details-title">Weights</h2>
          </div>
        </div>
        <div class="weight-grid">
          <div><strong>Messages</strong><span>1 point</span></div>
          <div><strong>Calls</strong><span>4 points</span></div>
          <div><strong>FaceTime</strong><span>5 points</span></div>
        </div>
      </section>
    </main>

    <template id="person-row-template">
      <li class="person-row">
        <div class="rank"></div>
        <div class="person-main">
          <div class="person-topline">
            <strong class="person-name"></strong>
            <span class="allocation"></span>
          </div>
          <div class="bar" aria-hidden="true"><span></span></div>
          <div class="person-meta"></div>
        </div>
      </li>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
