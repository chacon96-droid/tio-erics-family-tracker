<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f3ea">
    <title>Tio Eric's Family Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell checkin-shell">
      <section class="summary" aria-labelledby="checkin-title">
        <div>
          <p class="eyebrow">Tio Eric's family tracker</p>
          <h1 id="checkin-title">Check In</h1>
        </div>
      </section>

      <form id="checkin-form" class="checkin-form">
        <label>
          <span>Full name</span>
          <input name="name" autocomplete="name" required>
        </label>

        <label>
          <span>Relationship</span>
          <select name="relationship" required>
            <option value="">Choose one</option>
            <option>Brother</option>
            <option>Sister</option>
            <option>Niece</option>
            <option>Nephew</option>
            <option>Cousin</option>
            <option>Other family</option>
          </select>
        </label>

        <label>
          <span>Phone</span>
          <input name="phone" autocomplete="tel" inputmode="tel" required>
        </label>

        <label>
          <span>Email</span>
          <input name="email" autocomplete="email" inputmode="email" type="email">
        </label>

        <label>
          <span>Birthday</span>
          <input name="birthday" autocomplete="bday" type="date">
        </label>

        <label>
          <span>App PIN</span>
          <input name="pin" inputmode="numeric" minlength="4" maxlength="8" type="password" required>
        </label>

        <label class="consent-line">
          <input name="consent" type="checkbox" required>
          <span>I agree to share this contact information with family.</span>
        </label>

        <button class="primary-button" type="submit">Continue</button>
        <p id="checkin-status" class="form-status" role="status"></p>
      </form>
    </main>

    <script src="checkin.js" type="module"></script>
  </body>
</html>
